steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-southeast2-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-southeast2-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ "${_SERVICE_MODE}" = "PRODUCTION" ]; then
          echo "Deploying to production service: ${_SERVICE_NAME_PRODUCTION}"

          gcloud run deploy ${_SERVICE_NAME_PRODUCTION} \
            --image=asia-southeast2-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME \
            --region=asia-southeast1 \
            --platform=managed \
            --allow-unauthenticated
        else
          echo "Deploying to sandbox service: ${_SERVICE_NAME_SANDBOX}"

          gcloud run deploy ${_SERVICE_NAME_SANDBOX} \
            --image=asia-southeast2-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME \
            --region=asia-southeast1 \
            --platform=managed \
            --allow-unauthenticated
        fi

substitutions:
  _SERVICE_MODE: "PRODUCTION"
  _SERVICE_NAME: "gongaji-landing-page"
  _SERVICE_NAME_PRODUCTION: "gongaji-landing-page-web"
  _SERVICE_NAME_SANDBOX: "gongaji-landing-page-sandbox-web"
  _ARTIFACT_REPO: "gongaji-repo"

images:
  - asia-southeast2-docker.pkg.dev/$PROJECT_ID/$_ARTIFACT_REPO/$_SERVICE_NAME

